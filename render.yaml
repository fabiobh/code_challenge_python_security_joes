services:
  - type: web
    name: mcp-weather-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.mcp_server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .
      - key: GOOGLE_API_KEY
        sync: false
